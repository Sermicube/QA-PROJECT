[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "copiloto-certificacion-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "scipy>=1.13",
    "holidays>=0.51",
    "pytesseract>=0.3",
    "Pillow>=10.4",
    "opencv-python-headless>=4.10",
    "jinja2>=3.1",
    "anthropic>=0.34",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "neo4j>=5.23",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "factory-boy>=3.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "types-Pillow",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
