services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev-minimal
    env_file: ../.env
    volumes:
      - ../backend:/app
      - files:/data/files
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ../backend
    env_file: ../.env
    volumes:
      - ../backend:/app
      - files:/data/files
    depends_on:
      - postgres
      - redis
    command: celery -A app.core.celery_app worker --loglevel=debug

  frontend:
    build:
      context: ../frontend
      target: development
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copiloto
      POSTGRES_USER: copiloto
      POSTGRES_PASSWORD: copiloto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copiloto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  files:
  redis_data:
